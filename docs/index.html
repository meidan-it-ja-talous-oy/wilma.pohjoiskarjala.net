                width: 70%;
            }
            .kunta {

                width: 130px;

            .kunta:hover {

            }

            }
            .kuva {
                text-align: center;
                height: 75px;
                margin-top: 20px;
            }
            
            .kuva img {
                width: 55px;
            }
            .kunta_nim {
                text-align: center;
                color: #383838;
                height: 40px;
                padding-top: 11px;
                background-color: rgba(0, 0, 0, 0.1);
                border-radius: 0px 0px 8px 8px;
                border-top: solid 1px #fff;
            } 
            .kunta a {
                text-decoration: none;
            }
            .footer {
                position: relative;
                width: 100%;
                float: left;
                padding-top: 30px;
                margin-top: 30px;
                padding-bottom: 60px;
                margin-bottom: 0;
            }
            @media only screen and (max-width: 1000px) {
                .kunnat {
                    width: 90%;
                }
                .header {
                    font-size: 20px;
                    padding: 15px;
                }
                .footer {
                    padding-top: 15px;
                    margin-top: 30px;
                    padding-bottom: 30px;
                }
            }
            @media only screen and (max-width: 600px) {
                .kunnat {
                    width: 98%;
                }
            }
